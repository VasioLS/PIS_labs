{% extends "students/base.html" %}

{% block title %}
Регистрация — ElectiveHub
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">

            <div class="auth-icon">👤</div>

            <h1>Регистрация</h1>

            <p>Создайте аккаунт для работы с системой</p>

        </div>

        {% if form.error %}
            <div class="error-message">
                {{ form.error }}
            </div>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">Логин</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ form.username|default:'' }}"
                    placeholder="Не менее 3 символов"
                    autocomplete="username"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password">Пароль</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Не менее 6 символов"
                    autocomplete="new-password"
                    required
                >

            </div>

            <div class="form-group">

                <label for="password2">Повторите пароль</label>

                <input
                    type="password"
                    id="password2"
                    name="password2"
                    placeholder="Повторите пароль"
                    autocomplete="new-password"
                    required
                >

            </div>

            <button type="submit" class="btn btn-primary full-button">
                Зарегистрироваться
            </button>

        </form>

        <div class="auth-footer">

            Уже есть аккаунт?

            <a href="{% url 'login' %}">
                Войти
            </a>

        </div>

    </div>

</div>

{% endblock %}
